{% extends "layouts/base.html" %}
{% block content %}
<article class="h-entry">
	<h1 class="p-name">{{ title }}</h1>
	<p>{{ category }}{% if subcat %}: {{ subcat }}{% endif %}</p>
	<div class="e-content">{{ content | safe }}</div>
	{% if link %}<p><a href="{{ link }}">↗ {{ link }}</a></p>{% endif %}
	{% if date %}<p>Updated <time datetime="{{ date | w3DateFilter }}">{{ date | dateFilter }}</time></p>{% endif %}
</article>
{% endblock %}
