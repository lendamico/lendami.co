{% extends "layouts/base.html" %}
{% block content %}
<article>
	<h1>{{ title }}</h1>
	{{ content | safe }}
	{% for category in elsewhere.categories %}
	<div>
		<h2>{{ category.label }}</h2>
		<ul>
			{% for item in category.items %}
			<li>
				<a href="{{ item.url }}">{{ item.text }}</a>
			</li>
			{% endfor %}
		</ul>
	</div>
	{% endfor %}
</article>
{% endblock %}
